springdoc:
  default-consume-media-type: application/json
  default-produce-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html            # 접속 경로 커스텀
    disable-swagger-default-url: true
    display-request-duration: true    # 요청 소요 시간 표시
  api-docs:
    path: /api-docs                   # JSON 생성 경로 커스텀